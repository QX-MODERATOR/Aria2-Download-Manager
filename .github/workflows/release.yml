name: Release Bundles

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - name: Build Windows bundles
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\src-tauri\build-release.ps1 -SkipIconCacheClear
      - uses: actions/upload-artifact@v4
        with:
          name: windows-bundles
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-13
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - name: Install aria2
        run: brew install aria2 imagemagick
      - name: Build macOS bundles
        env:
          TAURI_TARGET: ${{ matrix.target }}
        run: bash ./scripts/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.target }}-bundles
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - name: Install Linux bundling dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential curl wget file libssl-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            patchelf rpm aria2
      - name: Build Linux bundles
        run: bash ./scripts/build-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-bundles
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
