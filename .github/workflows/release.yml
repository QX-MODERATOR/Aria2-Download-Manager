name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish"
        required: true
        default: "v1.0.0"
      title:
        description: "Release title"
        required: true
        default: "Aria2 Download Manager v1.0.0"
      body:
        description: "Release description"
        required: true
        default: "Initial public release."

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Build Windows installers
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install ImageMagick
        shell: pwsh
        run: choco install imagemagick --no-progress -y

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Show tool versions
        shell: pwsh
        run: |
          node --version
          npm --version
          rustc --version
          cargo --version
          npx tauri --version
          magick --version

      - name: Build Windows bundles
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\src-tauri\build-release.ps1 -SkipIconCacheClear

      - name: Collect Windows release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-assets -Force | Out-Null
          Copy-Item -LiteralPath (Get-ChildItem src-tauri\target\release\bundle\msi\*.msi | Select-Object -First 1).FullName -Destination release-assets
          Copy-Item -LiteralPath (Get-ChildItem src-tauri\target\release\bundle\nsis\*.exe | Select-Object -First 1).FullName -Destination release-assets
          Get-ChildItem release-assets

      - name: Upload Windows release assets
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: release-assets/*
          if-no-files-found: error

  macos:
    name: Build macOS bundle
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install native dependencies
        run: brew install aria2

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Show tool versions
        run: |
          node --version
          npm --version
          rustc --version
          cargo --version
          npx tauri --version

      - name: Build macOS bundles
        env:
          TAURI_BUNDLES: app,dmg
        run: bash ./scripts/build-macos.sh

      - name: Collect macOS release assets
        run: |
          TAURI_TARGET="$(rustc -Vv | awk '/host:/ { print $2 }')"
          mkdir -p release-assets
          find "src-tauri/target/$TAURI_TARGET/release/bundle/dmg" -name "*.dmg" -type f -exec cp {} release-assets/ \;
          app_path="$(find "src-tauri/target/$TAURI_TARGET/release/bundle/macos" -maxdepth 1 -name "*.app" -type d | head -n 1)"
          if [ -z "$app_path" ]; then
            echo "No .app bundle found." >&2
            exit 1
          fi
          (cd "$(dirname "$app_path")" && ditto -c -k --keepParent "$(basename "$app_path")" "$GITHUB_WORKSPACE/release-assets/$(basename "$app_path").zip")
          find release-assets -maxdepth 1 -type f -print

      - name: Upload macOS release assets
        uses: actions/upload-artifact@v4
        with:
          name: macos-bundle
          path: release-assets/*
          if-no-files-found: error

  linux:
    name: Build Linux packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Linux bundling dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential curl wget file libssl-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            pkg-config libxdo-dev patchelf libfuse2 aria2

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Show tool versions
        run: |
          node --version
          npm --version
          rustc --version
          cargo --version
          npx tauri --version
          aria2c --version | head -n 1

      - name: Build Linux bundles
        env:
          TAURI_BUNDLES: appimage,deb
        run: bash ./scripts/build-linux.sh

      - name: Collect Linux release assets
        run: |
          mkdir -p release-assets
          find src-tauri/target/release/bundle/appimage -name "*.AppImage" -type f -exec cp {} release-assets/ \;
          find src-tauri/target/release/bundle/deb -name "*.deb" -type f -exec cp {} release-assets/ \;
          find release-assets -maxdepth 1 -type f -print

      - name: Upload Linux release assets
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: release-assets/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - windows
      - macos
      - linux
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: |
          find release-assets -maxdepth 1 -type f -print | sort
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -gt 0

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.title || format('Aria2 Download Manager {0}', github.ref_name) }}
          body: ${{ github.event_name == 'workflow_dispatch' && inputs.body || 'Initial public release.' }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: release-assets/*
